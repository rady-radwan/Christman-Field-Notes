name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Report server connection (no secrets shown)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then host=$(echo "$SUPABASE_URL" | sed -E 's#^https?://##; s#/.*$##'); echo "::notice title=Server URL::set, host ${host}"; else echo "::notice title=Server URL::NOT set"; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then echo "::notice title=Server key::set, starts with ${SUPABASE_ANON_KEY:0:15}..."; else echo "::notice title=Server key::NOT set"; fi
      - run: flutter pub get
      - name: Analyze
        run: |
          dart analyze --format=machine > analyze.txt 2>&1 || true
          sed "s#${GITHUB_WORKSPACE}/##" analyze.txt | awk -F'|' 'NF>=8 {lvl=($1=="ERROR")?"error":(($1=="WARNING")?"warning":"notice"); printf "::%s file=%s,line=%s,col=%s::%s: %s\n", lvl, $4, $5, $6, $3, $8}'
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.txt || { echo "::error::$(tail -40 test.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Windows platform files
        shell: pwsh
        run: |
          flutter create --platforms=windows --org com.christman --project-name christman_field_notes .
          Copy-Item assets/icon/app_icon.ico windows/runner/resources/app_icon.ico -Force
          (Get-Content windows/runner/main.cpp) `
            -replace 'L"christman_field_notes"', 'L"Christman Field Notes"' `
            -replace 'Win32Window::Size size\(1280, 720\)', 'Win32Window::Size size(1440, 900)' |
            Set-Content windows/runner/main.cpp
          (Get-Content windows/runner/Runner.rc) `
            -replace '"christman_field_notes"', '"Christman Field Notes"' `
            -replace '"com.christman"', '"The Christman Company"' |
            Set-Content windows/runner/Runner.rc
          python tool/patch_windows_runner.py

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter pub get
          flutter build windows --release --dart-define=SUPABASE_URL=$env:SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build.log -Tail 45) -join '%0A'
            Write-Output "::error title=Windows build failed::$tail"
            exit 1
          }

      - name: Add Visual C++ runtime next to the app
        shell: pwsh
        run: |
          foreach ($f in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$f" build/windows/x64/runner/Release/ -Force
          }

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/field_notes.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: |
          flutter create --platforms=android --org com.christman --project-name christman_field_notes .
          python3 tool/patch_android.py

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
          flutter pub get
          v=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          echo "VERSION=$v" >> "$GITHUB_ENV"
          flutter build apk --release --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY 2>&1 | tee build.log || {
            echo "::error title=Android build failed::$(tail -60 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ChristmanFieldNotes-$v.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  publish:
    name: Publish installers
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Keeps the newest installers on the "installer" branch (one commit, replaced each build)
      # so they can be fetched with plain git as well as from Artifacts/Releases.
      - name: Save latest installers to the installer branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir inst && cd inst
          git init -q -b installer
          cp ../dist/* .
          echo "Latest Windows and Android installers built from main at ${{ github.sha }}." > README.md
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Installers from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" installer

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
