name: christman_field_notes
description: Christman Field Observations - field observations with marked-up photos and voice notes.
publish_to: 'none'
version: 0.7.0+8

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  image: ^4.2.0
  uuid: ^4.5.1
  supabase_flutter: ^2.8.0
  record: ^6.0.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/icon/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700

    - family: Google Sans
      fonts:
        - asset: assets/fonts/extra/GoogleSans-400.ttf
          weight: 400
        - asset: assets/fonts/extra/GoogleSans-600.ttf
          weight: 600
        - asset: assets/fonts/extra/GoogleSans-700.ttf
          weight: 700

    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/extra/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/extra/IBMPlexSans-600.ttf
          weight: 600
        - asset: assets/fonts/extra/IBMPlexSans-700.ttf
